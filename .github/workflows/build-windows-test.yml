name: Build LED banding test app (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/windows/**"
      - ".github/workflows/build-windows-test.yml"

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build Windows x64 installer and portable ZIP
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: lightcraft-led-banding-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
