name: LED banding code check

on:
  push:
    branches: [ "feat/sony-a9-led-banding" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check pipeline and UI compile
        run: cargo check -p lightcraft-pipeline -p lightcraft-ui-egui
      - name: Run LED banding unit tests
        run: cargo test -p lightcraft-pipeline led_banding --lib
